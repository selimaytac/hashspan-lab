# Single-binary Tempo, after grafana/tempo's example/docker-compose/single-binary for 3.1.0, without the metrics
# generator: the lab's metrics come from hashspan's histograms.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
