# Local lab stack: OpenTelemetry Collector (OTLP in), Tempo (traces), Prometheus (metrics), Grafana (dashboards).
# Every port binds to 127.0.0.1 only, on ports of its own so the stack can run beside other local OTLP backends.
# Managed via the Makefile: make lab-up / lab-down / lab-nuke.
name: hashspan-lab-stack

services:
  collector:
    image: otel/opentelemetry-collector:0.163.2-386@sha256:6af85116b470638e039d957f130990f0de7aaa46e51863e8c133e83590758992
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:14317:4317" # OTLP gRPC
      - "127.0.0.1:14318:4318" # OTLP HTTP
    depends_on: [tempo, prometheus]
    deploy:
      resources:
        limits: { memory: 256m }

  tempo:
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:13200:3200" # HTTP API
    deploy:
      resources:
        limits: { memory: 512m }

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-otlp-receiver
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:19090:9090" # UI and HTTP API
    deploy:
      resources:
        limits: { memory: 512m }

  grafana:
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    environment:
      # Local only (127.0.0.1): dashboards open without login; log in (admin / admin on first start) to edit.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:13000:3000" # UI
    depends_on: [tempo, prometheus]
    deploy:
      resources:
        limits: { memory: 512m }

volumes:
  tempo-data:
  prometheus-data:
  grafana-data:
