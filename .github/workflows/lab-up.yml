# The one-command lab end to end: `make demo` (install, then `pnpm lab up`) checks the machine, starts the stack, runs every local scenario and fails
# on an empty dashboard panel (except those documented to stay empty on a healthy run). No secrets, no network but
# the image registries and npm.
name: Lab up

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lab-up-${{ github.ref }}
  cancel-in-progress: true

jobs:
  up:
    name: One command, end to end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # `make demo` is what a user runs on a clean clone: it installs, then runs `pnpm lab up`.
      - run: make demo
      - name: Stack logs
        if: failure()
        run: docker compose -f stack/compose.yaml logs --no-color --tail 200
