# What a new user does with the PUBLISHED packages: the quick start of hashspan's README at the release's own tag, run
# against the npm registry in an empty project, with its trace checked in the lab's Tempo (`pnpm lab first-run`).
# By hand, for any version or dist-tag (`rc` by default). No secrets.
name: First run

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version or dist-tag of @hashspan/viem
        default: rc
        type: string

permissions:
  contents: read

jobs:
  first-run:
    name: first run of ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.version)) || fromJSON('["rc", "latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/install-anvil.sh
      - run: docker compose -f stack/compose.yaml up -d --wait
      - name: Run the quick start
        env:
          VERSION: ${{ matrix.version }}
        run: pnpm lab first-run --version "$VERSION"
      - name: Stack logs
        if: failure()
        run: docker compose -f stack/compose.yaml logs --no-color --tail 100
